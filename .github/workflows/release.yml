name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in script
        run: |
          sed -i "s/^WT_LINK_VERSION=.*/WT_LINK_VERSION=\"${{ steps.version.outputs.version }}\"/" bin/wt-link

      - name: Create release tarball
        run: |
          ARCHIVE="wt-link-${{ steps.version.outputs.version }}.tar.gz"
          tar -czf "$ARCHIVE" bin/wt-link lib/wt-link/
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: archive

      - name: Compute SHA256
        id: sha256
        run: echo "hash=$(sha256sum "${{ steps.archive.outputs.archive }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1 }
            flag && $0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]" { exit }
            flag { print }
          ' CHANGELOG.md > release-changelog.md

          if [[ ! -s release-changelog.md ]]; then
            echo "Missing changelog entry for version $VERSION in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Changelog"
            echo
            cat release-changelog.md
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo 'brew tap piqusy/tap'
            echo 'brew install piqusy/tap/wt-link'
            echo '```'
            echo
            echo '### Manual download'
            echo
            echo "Download \`wt-link-${VERSION}.tar.gz\` below, then:"
            echo
            echo '```bash'
            echo "tar -xzf wt-link-${VERSION}.tar.gz"
            echo 'sudo cp bin/wt-link /usr/local/bin/'
            echo 'sudo cp -r lib/wt-link /usr/local/lib/'
            echo '```'
            echo
            echo 'Verify checksum:'
            echo '```bash'
            echo "sha256sum -c wt-link-${VERSION}.tar.gz.sha256"
            echo '```'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: piqusy/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release tarball
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo piqusy/wt-link \
            --pattern "wt-link-*.tar.gz" \
            --output "wt-link-${{ steps.version.outputs.version }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute SHA256
        id: sha256
        run: echo "hash=$(sha256sum "wt-link-${{ steps.version.outputs.version }}.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.hash }}"
          FORMULA="homebrew-tap/Formula/wt-link.rb"

          sed -i "s|releases/download/v.*/wt-link-.*\.tar\.gz\"|releases/download/v${VERSION}/wt-link-${VERSION}.tar.gz\"|" "$FORMULA"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$FORMULA"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wt-link.rb
          git diff --cached --quiet || git commit -m "update(wt-link): bump to v${{ steps.version.outputs.version }}"
          git push
